# ============================================================
# Rotrix Dashboard — Docker Compose (EC2 t3.medium / 4GB RAM)
# ============================================================
# Usage:
#   docker compose up --build        (first run / after code changes)
#   docker compose up -d             (background / production)
#   docker compose down              (stop)
#   docker compose logs -f app       (tail app logs)
#
# Environment variables are loaded from .env in this directory.
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: rotrix-db
    environment:
      POSTGRES_DB: rotrix
      POSTGRES_USER: rotrix
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotrix -d rotrix"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rotrix-app
    ports:
      - "${PORT:-8501}:${PORT:-8501}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8501}
      - DATABASE_URL=postgresql://rotrix:${DB_PASSWORD}@db:5432/rotrix
      - AUTH_BACKEND=local_pg
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_ROOT=/data/rotrix-files
    volumes:
      - filedata:/data/rotrix-files
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-8501}/_stcore/health')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: rotrix-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

volumes:
  pgdata:
  filedata:
