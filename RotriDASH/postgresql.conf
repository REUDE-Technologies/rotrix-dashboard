# PostgreSQL tuning for EC2 t3.medium (4 GB RAM, 2 vCPU)
# Target: ~300 MB memory footprint for PG

listen_addresses = '*'
port = 5432

# --- Memory ---
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 512MB

# --- Connections ---
max_connections = 30

# --- WAL ---
wal_buffers = 4MB
checkpoint_completion_target = 0.9
max_wal_size = 256MB
min_wal_size = 64MB

# --- Query planner ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Logging ---
log_min_duration_statement = 1000
log_timezone = 'UTC'
timezone = 'UTC'
